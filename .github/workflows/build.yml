name: build
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned build compiler
        shell: powershell
        run: ./source/prepare-media.ps1 -CompilerOnly
      - name: Validate translations and help
        shell: powershell
        run: python tools/check-release-content.py
      - name: Build
        shell: powershell
        working-directory: source
        run: ./build.ps1 -OutputDirectory "$env:RUNNER_TEMP\out"
      - name: Self tests
        shell: powershell
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'out\File Compass.exe'
          foreach ($test in 'self-test', 'copy-test', 'archive-test', 'preview-refresh-test', 'toolbar-dialog-test', 'language-test', 'help-window-test', 'vendor-updates-test', 'disk-analyzer-test', 'disk-smart-test', 'integrity-test', 'fluent-preview-test', 'rename-fluent-test', 'undo-history-test', 'cascade-navigation-test', 'unified-search-test', 'task-dock-grouping-test') {
            $work = Join-Path $env:RUNNER_TEMP "w-$test"; New-Item -ItemType Directory $work -Force | Out-Null
            $process = Start-Process $exe -ArgumentList "--$test", "`"$work`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$test failed ($($process.ExitCode))" }
          }
